image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test
  - package
  - deploy

variables:
  PROJECT_PATH: "src/Enduro.Lacrm/Enduro.Lacrm.csproj"
  TEST_PROJECT_PATH: "src/Enduro.Lacrm.Tests/Enduro.Lacrm.Tests.csproj"
  COVERAGE_REGEX: 'Line coverage: (\d+(?:\.\d+)?%)'

default:
  tags:
    - docker
    - Tulsa

build:
  stage: build
  before_script:
    - dotnet --info
  script:
    - dotnet restore
    - dotnet build -c Release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'

test:
  stage: test
  needs: ["build"]
  before_script:
    - dotnet --info
  script:
    - dotnet restore
    - dotnet test "$TEST_PROJECT_PATH" -c Release --collect:"XPlat Code Coverage" --logger:"junit;LogFilePath=./artifacts/{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
    - dotnet tool install --global dotnet-reportgenerator-globaltool
    - export PATH="$PATH:/root/.dotnet/tools"
    - reportgenerator -reports:"src/**/coverage.cobertura.xml" -targetdir:CoverageResults/Combined -reporttypes:Cobertura,TextSummary
    - |
      set +e
      if [ -f CoverageResults/Combined/Cobertura.xml ]; then
        rate=$(grep 'line-rate=' CoverageResults/Combined/Cobertura.xml | head -1 | sed 's/.*line-rate="\([^"]*\)".*/\1/')
        pct=$(echo "$rate" | awk '{val=$1*100; if (val==int(val)) printf "%.0f", val; else printf "%.1f", val}')
        echo "Line coverage: ${pct}%"
      else
        echo "Line coverage: 0.0%"
      fi
      set -e
  artifacts:
    when: always
    paths:
      - "CoverageResults/Combined/**"
      - "**/*-test-result.xml"
    reports:
      junit:
        - "**/*-test-result.xml"
      coverage_report:
        coverage_format: cobertura
        path: CoverageResults/Combined/Cobertura.xml
  coverage: '/Line coverage: (\d+(?:\.\d+)?%)/'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'

package:
  stage: package
  needs: ["build", "test"]
  before_script:
    - dotnet --info
  script:
    - dotnet pack "$PROJECT_PATH" -c Release -o artifacts/nuget
  artifacts:
    when: on_success
    paths:
      - artifacts/nuget/**
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG'

deploy:
  stage: deploy
  needs: ["package"]
  script:
    - dotnet nuget push artifacts/nuget/*.nupkg -s https://nexus.enduropls.com/repository/nuget-hosted -k $NUGET__API__KEY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG'
